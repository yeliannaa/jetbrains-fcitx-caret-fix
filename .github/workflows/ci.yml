name: Build and installer tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libx11-dev
      - name: Shell syntax
        run: for script in *.sh; do bash -n "$script"; done
      - name: Build
        run: bash build.sh
      - name: Mock installer tests (no desktop)
        run: python3 -B -m unittest discover -s tests -v
      - name: Check package
        run: |
          bash package.sh
          cd dist
          sha256sum -c *.sha256
